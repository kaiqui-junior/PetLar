<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta - PetLar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<div class="auth-page">
  <div class="form-card" style="margin:0;">
    <h2>Crie sua conta 🐶</h2>
    <p class="form-subtitle">Cadastre-se para publicar pets e favoritar anúncios.</p>

    <form id="cadastro-form">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" name="name" class="form-control" required placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" class="form-control" required placeholder="seuemail@exemplo.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" name="password" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-row">
      <div class="form-group">
        <label>Estado</label>
        <select name="state" class="form-control" id="state-select-cadastro" required></select>
      </div>
  <div class="form-group">
    <label>Cidade</label>
    <select name="city" class="form-control" id="city-select-cadastro" required disabled>
      <option value="">Selecione o estado primeiro</option>
    </select>
  </div>
</div>
      <div class="form-group">
        <label>Telefone <span class="hint" style="display:inline;">(opcional)</span></label>
        <input type="tel" name="phone" class="form-control" placeholder="(00) 00000-0000">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="cadastro-btn">Criar conta</button>
    </form>

    <p class="auth-links">Já tem uma conta? <a href="login.html">Entrar</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/header.js"></script>
<script src="js/auth.js"></script>
<script>
  initLayout('');

  const stateSelect = document.getElementById('state-select-cadastro');
  stateSelect.innerHTML = '<option value="">Selecione</option>' + ESTADOS_BR.map(uf => `<option value="${uf}">${uf}</option>`).join('');

  const citySelect = document.getElementById('city-select-cadastro');

stateSelect.addEventListener('change', async () => {
  const uf = stateSelect.value;

  if(!uf){
    citySelect.innerHTML = '<option value="">Selecione o estado primeiro</option>';
    citySelect.disabled = true;
    return;
  }

  preencherSelectComoCarregando(citySelect);

  try{
    const cidades = await buscarCidadesPorUF(uf);
    citySelect.innerHTML = '<option value="">Selecione a cidade</option>' +
      cidades.map(c => `<option value="${c}">${c}</option>`).join('');
    citySelect.disabled = false;
  }catch(err){
    console.error(err);
    citySelect.innerHTML = '<option value="">Erro ao carregar. Tente selecionar o estado novamente.</option>';
    citySelect.disabled = true;
    showToast('Não foi possível carregar as cidades. Verifique sua internet.', 'warning');
  }
});

  auth.onAuthStateChanged((user) => {
    if(user) window.location.href = 'perfil.html';
  });

  document.getElementById('cadastro-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('cadastro-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner spinner-sm"></span> Criando conta...';
    try{
      await registrarUsuario({
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        city: form.city.value.trim(),
        state: form.state.value,
        phone: form.phone.value.trim()
      });
      showToast('Conta criada com sucesso! Bem-vindo(a) ao PetLar.', 'success');
      setTimeout(() => window.location.href = 'perfil.html', 800);
    }catch(err){
      showToast(traduzirErroFirebase(err), 'error');
      btn.disabled = false;
      btn.textContent = 'Criar conta';
    }
  });
</script>
</body>
</html>
